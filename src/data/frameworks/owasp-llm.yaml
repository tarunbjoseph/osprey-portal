summary: "The 2026 release is the first built on incident evidence as well as practitioner vote — 7,714 real incidents scored against the community ranking. Ordering moved materially: Excessive Agency climbed to third because agentic deployments are where damage lands, Unbounded Consumption rose four places, and System Prompt Leakage was re-scoped into the broader Hidden Context Exposure. The list owns risk where the model is a component inside an application; once the model becomes an actor with tools and memory, risk moves to the Agentic Top 10."
