summary: "Twenty-five controls across four pillars — Safety, Alignment, Governance, Security — each risk-justified, testable, and mapped to public frameworks. AGSC is the primary anchor for this portal: every OSPREY threat category names the control it provides evidence for before it names any external framework. Controls carry an adoption tier (T1 foundational, T2 managed, T3 assured) that sequences implementation rather than replacing internal risk classification."
