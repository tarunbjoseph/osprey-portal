summary: "An operating model that sits beneath existing standards and makes them executable. Three pillars — Adopt, Defend, Govern — scale from board to engineer. Beneath them sit nine governance surfaces where engineers instrument and attackers act, twelve minimum controls each with a named evidence artifact, three autonomy tiers, and a four-class harm taxonomy. OSPREY uses the surfaces as its coverage axis, the minimum controls as its evidence targets, and the autonomy tiers as the consequence of a detection."
