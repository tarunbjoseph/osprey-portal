summary: "The agentic counterpart to the LLM Top 10, covering the risks that appear once a model can call tools, carry memory between sessions, and set consequences in motion downstream. This is the closest external list to what OSPREY actually monitors, which is why most OSPREY categories carry an ASI anchor even where the LLM anchor is indirect."
