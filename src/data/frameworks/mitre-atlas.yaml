summary: "The adversarial-ML counterpart to ATT&CK: sixteen tactics and a growing technique catalogue, with recent releases adding heavily to agent, tool and supply-chain coverage. Note that ATLAS ships under two version schemes — the primary distribution reports 5.6.0, while OWASP 2026 pins a dated content distribution (v2026.06, format-version 6.0.0). Both are real; this portal anchors tactics against the primary distribution and marks technique identifiers individually."
