summary: "Binding obligations for high-risk AI, including human oversight (Art. 14), accuracy and robustness (Art. 15), logging (Art. 12), transparency (Art. 13 and 50), post-market monitoring (Art. 72) and serious-incident reporting (Art. 73). Article references on this portal follow the per-control mappings published in AGSC and ADG rather than an independent legal reading, and are cited as pointers rather than as compliance conclusions."
