name: "Model"
framework: "adg"
pillars:
  - "Adopt"
  - "Govern"
scope: "The models themselves and everything that varies them: base models, fine-tunes, adapters, routers, pinned versions, and chains that combine several."
objective: "Only approved models run, and each one’s origin, risk posture and change history is known."
coverage: "indirect"
coverageNote: "Runtime behaviour is what this platform observes; model provenance and approval are established before deployment. Detections reach this surface only where an observed component diverges from what the registry says should be running."
order: 10
