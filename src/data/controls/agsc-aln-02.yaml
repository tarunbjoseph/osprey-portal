code: ALN-02
name: Human Oversight & Intervention
framework: agsc
pillar: Alignment
tier: T1
purpose: >-
  Ensure human oversight is accessible, timely, and meaningful, occurring before high-impact or
  irreversible actions rather than only after the fact.
evidence:
  - Oversight and escalation process
  - Defined reviewer roles and decision rights
  - Approval or intervention records
  - Evidence of approval gates for sensitive actions
  - Testing records showing oversight works as intended
surfaces:
  - orchestration
  - safety-layer
ospreyCoverage: direct
coverageNote: >-
  The autonomy-tier downgrade rule is this control expressed as a runtime mechanism. Every threat
  row states the tier the agent holds after detection.
order: 22
appliesTo: >-
  AI systems or agents used in business processes where outputs, recommendations, or actions may
  affect people, operations, or organizational outcomes.
requirements:
  - Define when human oversight is required
  - Assign clear review and approval responsibilities
  - Enable people to pause, escalate, or override AI activity when needed
  - Require approval before high-impact or irreversible actions
  - Record key reviews, approvals, and interventions
reviewCadence:
  - Pre-deployment review of oversight design
  - Periodic review based on risk tier and use frequency
  - Testing before high-risk systems go live
  - >-
    Additional review after incidents, user feedback, workflow changes, autonomy changes, or changes
    to decision impact
example: >-
  An AI agent is able to submit a filing, send funds, delete records, or trigger a
  customer-impacting workflow before any person can review the action. The organization technically
  has “oversight,” but only through after-the-fact reports. This control helps prevent that failure
  by requiring timely human intervention and approval gates before high-impact actions occur.
origin: Adapted
applicability: Both
mappings:
