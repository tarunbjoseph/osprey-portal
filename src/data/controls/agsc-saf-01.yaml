      Lateral Movement. Reported upstream.
  - framework: attack
    value: N/A — emerging agentic orchestration pattern; no official ATT&CK technique ID assigned.
  - framework: euAiAct
    value: Art. 14, 15
  - framework: nistRmf
    value: MANAGE 4.1; MEASURE 2.x
  - framework: iso42001
    value: A.6.2, A.9
