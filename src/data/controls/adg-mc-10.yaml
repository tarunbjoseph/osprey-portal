code: "MC-10"
name: "Periodic Governance Review"
framework: "adg"
pillar: "Govern"
purpose: "Governance is reviewed on a schedule, exceptions are dispositioned explicitly rather than left to accumulate, and high-risk systems are reported upward."
evidence:
  - "Review records showing what was found, what was decided, and what happened to each open exception"
surfaces:
  - "telemetry"
ospreyCoverage: "none"
coverageNote: "A governance-process control. OSPREY supplies inputs to the review but produces no evidence for it directly."
order: 10
