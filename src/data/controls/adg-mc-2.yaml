code: "MC-2"
name: "Risk Classification"
framework: "adg"
pillar: "Govern"
purpose: "Each system is graded on the dimensions that decide how much governance it needs: how sensitive its data is, how autonomously it acts, who can reach it, what it could damage, and how far the business depends on it."
evidence:
  - "A recorded classification for each system, produced against a consistent scheme rather than decided case by case"
surfaces:
  - "model"
ospreyCoverage: "indirect"
coverageNote: "The autonomy tier OSPREY downgrades on detection is the tier this control assigns at design time."
order: 2
