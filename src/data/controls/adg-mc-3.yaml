code: "MC-3"
name: "Separation of Duties"
framework: "adg"
pillar: "Govern"
purpose: "The people who ship a system, the people who test its security, and the people who authorise its release are not the same people."
evidence:
  - "A responsibility map per system showing that no single function holds delivery, validation and approval together"
surfaces:
  - "identity"
  - "orchestration"
ospreyCoverage: "indirect"
coverageNote: "OSP-09 enforces the runtime half: an agent should not be able to authorise its own delegation."
order: 3
