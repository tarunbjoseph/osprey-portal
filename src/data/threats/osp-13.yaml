code: "OSP-13"
name: "Sandbox / Host Escape"
order: 8
scope: "core"
behaviour: "The agent’s execution environment stops holding. Code the agent runs breaks out of its sandbox onto the host, or reaches machine resources and artifacts the agent was never scoped to touch."
signals:
  - "Process or filesystem activity outside the sandbox mount"
  - "Container runtime or hypervisor API calls from agent-executed code"
  - "Reads of local model artifacts or credentials on the host"
  - "Egress from the execution sandbox to internal networks"
severity: "critical"
harmClasses:
  - "technical"
  - "systemic"
harmNote: "Systemic once the host is reached: everything else running on that machine is in scope."
action:
  peak: "kill"
  summary: "Kill the execution environment and quarantine the agent session. A deterministic runtime check, not a model decision."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Always. Restart requires formal approval plus a forensic replay of the session that produced the escape."
detection:
  instrument: "deterministic"
  method: "Runtime boundary events from the sandbox and container layer"
  rationale: "A boundary violation is observable at the runtime layer. Sandbox egress, host process activity and container API calls are facts, not judgements. Asking a classifier to infer them would be strictly worse than reading them."
  inGate1: false
  dependsOn:
    - "Container and host-boundary event stream"
    - "Sandbox egress logging"
evidence:
  - "Containment activation records and recovery evidence (AGSC SAF-02)"
  - "Replayable incident evidence capture (ADG MC-9)"
anchors:
  -
    framework: "agsc"
    id: "SAF-02"
    label: "Emergency Stop & Containment (Kill Switch)"
    weight: "primary"
    rationale: "This is the category that most directly exercises the kill switch."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SEC-02"
    label: "Agent Identity & Least-Privilege Authorization"
    weight: "supporting"
    rationale: "Host reach is privilege escalation past the declared scope."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Configuration and boundary drift in production."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-9"
    label: "AI Incident Response"
    weight: "primary"
    rationale: "A confirmed escape is an incident with forensic-replay obligations."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM10"
    label: "Improper Output Handling"
    weight: "primary"
    rationale: "Unvalidated generated code reaching a shell is the usual path."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM03"
    label: "Excessive Agency"
    weight: "supporting"
    rationale: "A shell-command tool that fails to filter unintended commands."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI05"
    label: "Unexpected Code Execution (RCE)"
    weight: "primary"
    rationale: "File-system and cloud-API access turning execution into host compromise."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0005"
    label: "Execution"
    weight: "primary"
    rationale: "Adversary-chosen code running on the host."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0012"
    label: "Privilege Escalation"
    weight: "primary"
    rationale: "Crossing the sandbox boundary is escalation by definition."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0097 / T0105 / T0112"
    label: "Sandbox evasion, escape to host, machine compromise"
    weight: "supporting"
    verification: "pending"
    rationale: "Technique identifiers carried from an earlier revision. Not re-confirmed against a reachable ATLAS source in the latest validation pass — confirm before external citation."
regulatory:
  - "EU AI Act Art. 15"
  - "NIST AI RMF MANAGE 4.1"
  - "ISO/IEC 42001 A.6.2, A.9"
