code: "OSP-03"
name: "Indirect / Context Poisoning"
order: 3
scope: "core"
behaviour: "Malicious instructions reach the agent through content it reads rather than from the user: a retrieved document, a web page, a tool response, or its own long-term memory. The agent treats that content as trusted context."
signals:
  - "Instruction-shaped text inside retrieved documents or tool outputs"
  - "Behaviour change immediately following a retrieval event"
  - "Writes to long-term memory containing directives rather than facts"
  - "Instructions whose execution is conditioned on a later turn or date"
  - "A single document dominating retrieval results for a query"
severity: "high"
harmClasses:
  - "technical"
  - "systemic"
harmNote: "Becomes systemic the moment a poisoned write persists: every later session that reads the store inherits it."
action:
  peak: "quarantine"
  summary: "Quarantine the poisoned context and block the memory write. Escalate to the frontier layer when the classification is ambiguous."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Required. A poisoned memory write persists across every later session, so the write approval cannot be automated away."
detection:
  instrument: "hybrid"
  method: "SLM classifier over the span, gated by a provenance rule"
  slmDifficulty: "medium"
  rationale: "The text classification resembles OSP-02, but the hard part is provenance: knowing a span came from a retrieved document rather than the user. That is a telemetry field, not a model capability. Without it the model is guessing."
  inGate1: true
  dependsOn:
    - "Span-level provenance (user / retrieval / tool / memory)"
    - "Memory write interception"
evidence:
  - "Input provenance records (AGSC GOV-01)"
  - "Memory-write decisions (AGSC SEC-07)"
  - "Context policy conformance (ADG MC-6)"
anchors:
  -
    framework: "agsc"
    id: "SEC-03"
    label: "Prompt Injection & Adversarial Input Defense"
    weight: "primary"
    rationale: "The control explicitly covers instructions hidden in untrusted external content."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SEC-07"
    label: "Memory & Context Lifecycle Security"
    weight: "primary"
    rationale: "Poisoned context that persists is a memory-lifecycle failure."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "GOV-01"
    label: "Data Provenance & Input Integrity"
    weight: "supporting"
    rationale: "The provenance field this control establishes is what makes the label detectable at all."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-6"
    label: "Context Policy"
    weight: "primary"
    rationale: "Trust ordering across context inputs is exactly what this attack subverts."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "supporting"
    rationale: "Detection and alerting on poisoned retrieval."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM01"
    label: "Prompt Injection"
    weight: "primary"
    rationale: "The indirect-delivery half: injection arriving through retrieved content or tool output."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM05"
    label: "Data and Model Poisoning"
    weight: "primary"
    rationale: "Covers RAG knowledge-base poisoning and persistent agent-memory poisoning across sessions."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM09"
    label: "Vector and Embedding Weaknesses"
    weight: "supporting"
    rationale: "Where the attack exploits retrieval geometry rather than instruction-following."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI06"
    label: "Memory & Context Poisoning"
    weight: "primary"
    rationale: "The direct agentic counterpart."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0070"
    label: "RAG Poisoning"
    weight: "primary"
    rationale: "Poisoning the retrieval corpus so malicious content surfaces for a targeted query."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0080"
    label: "AI Agent Context Poisoning"
    weight: "primary"
    rationale: "Poisoning the agent’s working context directly."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0099"
    label: "AI Agent Tool Data Poisoning"
    weight: "primary"
    rationale: "Placing malicious content where agent tools will retrieve it."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0093"
    label: "Prompt Infiltration via Public-Facing Application"
    weight: "supporting"
    rationale: "Delivery through a public surface the agent later ingests."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0006"
    label: "Persistence"
    weight: "supporting"
    rationale: "Injected instructions written to memory survive across sessions and re-fire on recall."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 10, 15"
  - "NIST AI RMF MEASURE 2.7; MAP 2"
  - "ISO/IEC 42001 A.6.2, A.7"
