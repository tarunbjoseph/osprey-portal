code: "OSP-02"
name: "Direct Prompt Injection"
order: 2
scope: "core"
behaviour: "A user or upstream caller embeds instructions in their input that override the agent’s system prompt or assigned task. The agent follows the injected instruction instead of its own."
signals:
  - "Instruction-shaped text in user-supplied fields"
  - "References to the system prompt, or \"ignore previous\" patterns"
  - "The agent’s declared objective changing immediately after a user input event"
  - "Obfuscated encodings — base64, invisible Unicode, low-resource language — in user fields"
severity: "high"
harmClasses:
  - "technical"
action:
  peak: "block"
  summary: "Block at input on high confidence. Escalate ambiguous cases to the frontier escalation layer rather than auto-resolving."
  tier: "HOTL"
  humanReview: "no"
  reviewNote: "No human needed for a clean block. The agent runs at HOTL for the remainder of the session, and repeat attempts against the same agent escalate to review."
detection:
  instrument: "slm-classifier"
  method: "Fine-tuned SLM classifier over the input span"
  slmDifficulty: "easy"
  rationale: "The closest thing in the register to a standard text-classification task. Single input, plentiful synthetic examples, clear positive class. The label most likely to hit its target first, and the right anchor for the first evaluation gate."
  inGate1: true
  dependsOn:
    - "Input span capture with field attribution"
evidence:
  - "Injection detection results and blocked-input records (AGSC SEC-03)"
  - "Adversarial test results (ADG MC-4)"
anchors:
  -
    framework: "agsc"
    id: "SEC-03"
    label: "Prompt Injection & Adversarial Input Defense"
    weight: "primary"
    rationale: "The control this label exists to provide evidence for."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Blocked-input records are monitoring evidence with a defined threshold."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-4"
    label: "Pre-Production Evaluation"
    weight: "supporting"
    rationale: "Injection testing before go-live is part of this control’s signed report."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM01"
    label: "Prompt Injection"
    weight: "primary"
    rationale: "The direct-delivery half of the 2026 entry, which holds the top rank on the strength of the community vote."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI01"
    label: "Agent Goal Hijack"
    weight: "primary"
    rationale: "Injected input overrides the system-prompt role and capability constraints, redirecting agent goals."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI02"
    label: "Tool Misuse & Exploitation"
    weight: "supporting"
    rationale: "Injected input drives unauthorized tool invocation."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0051"
    label: "LLM Prompt Injection"
    weight: "primary"
    rationale: "The technique this category is named after."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0004"
    label: "Initial Access"
    weight: "supporting"
    rationale: "Injected instructions are the foothold that lets an attacker seize control of model behaviour."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0007"
    label: "Defense Evasion"
    weight: "supporting"
    rationale: "Obfuscated encodings and jailbreak phrasing slip past safety filters."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 15"
  - "NIST AI RMF MEASURE 2.7"
  - "ISO/IEC 42001 A.6.2"
