code: "OSP-14"
name: "Resource Exhaustion & Denial of Wallet"
order: 9
scope: "core"
addedIn: "v1.0"
behaviour: "The agent consumes compute, tokens or spend far beyond what the task warrants — a reasoning loop that will not terminate, a retry storm, or a tool-call fan-out where one request becomes hundreds. No single call looks wrong; the damage is the aggregate."
signals:
  - "Thinking or output token spend per session far above baseline for the task type"
  - "Non-terminating reasoning loops"
  - "Tool-call fan-out ratio above threshold"
  - "Retry counts with no state change between attempts"
  - "Sustained near-context-limit requests"
  - "Session cost breaching its budget envelope"
severity: "medium-high"
severityNote: "High where spend is uncapped, because the ceiling on the loss is set by the billing account rather than by the system."
harmClasses:
  - "operational"
  - "technical"
action:
  peak: "block"
  summary: "Monitor against a hard budget ceiling. Review on breach; circuit-break the loop at the hard cap."
  tier: "HOTL"
  humanReview: "conditional"
  reviewNote: "The circuit-break is automatic. HOTL authorises a restart; a second breach in the same workflow escalates to HITL."
detection:
  instrument: "statistical"
  method: "Budget counters and fan-out thresholds per session"
  rationale: "Token spend, fan-out ratio, retry count and session cost are counters. A model asked to judge them would be slower, more expensive and less accurate than the arithmetic. The circuit breaker is the control; the model has no first-pass role."
  inGate1: false
  dependsOn:
    - "Per-session token and cost telemetry"
    - "Tool-call fan-out counters"
evidence:
  - "Cost and consumption telemetry with breach records (AGSC SEC-04, GOV-08)"
  - "Retry-budget and recursion-limit evidence (ADG MC-8)"
anchors:
  -
    framework: "agsc"
    id: "SEC-04"
    label: "Observability, Anomaly Detection & Incident Response"
    weight: "primary"
    rationale: "Abnormal consumption is an anomaly with a defined threshold."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SAF-02"
    label: "Emergency Stop & Containment (Kill Switch)"
    weight: "supporting"
    rationale: "The circuit breaker is a scoped kill switch."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "GOV-08"
    label: "Environmental & Carbon Governance"
    weight: "supporting"
    rationale: "The same counters serve efficiency reporting."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Abuse detection with defined alert thresholds."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM06"
    label: "Unbounded Consumption"
    weight: "primary"
    rationale: "The entry that rose four places in 2026, covering denial of wallet, reasoning-loop exhaustion and MCP fan-out."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI02"
    label: "Tool Misuse & Exploitation"
    weight: "primary"
    rationale: "Agent-tool loops and MCP fan-out drive recursive high-volume calls."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI08"
    label: "Cascading Failures"
    weight: "primary"
    rationale: "Agentic architectures amplify a single request into cascading downstream operations."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0034"
    label: "Cost Harvesting"
    weight: "primary"
    rationale: "Driving expensive computation at the victim’s expense."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0011"
    label: "Impact"
    weight: "supporting"
    rationale: "Availability and cost harm."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 15"
  - "NIST AI RMF MANAGE 4.1"
  - "ISO/IEC 42001 A.6.2"
