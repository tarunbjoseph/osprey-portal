code: "OSP-01"
name: "Intent / Goal Drift"
order: 1
scope: "core"
behaviour: "The agent gradually stops working on the task it was given. It still looks busy and may report progress, but its actions aim at something other than the original objective. Drift can be induced by an attacker or emerge on its own from a long, messy session."
signals:
  - "Trajectory embedding distance from the task baseline exceeds threshold"
  - "Tool calls unrelated to the declared task"
  - "A widening gap between the agent’s stated plan and its executed actions"
  - "Session step count well above baseline for that task type"
  - "Repeated re-planning with no progress toward the declared goal"
severity: "high"
harmClasses:
  - "operational"
  - "systemic"
harmNote: "Operational while contained to one agent; systemic once a drifting agent’s output is consumed downstream."
action:
  peak: "quarantine"
  summary: "Monitor continuously. Review at moderate drift, quarantine at high drift."
  tier: "HITL"
  humanReview: "conditional"
  reviewNote: "Drops the agent to HOTL at Review and HITL at Quarantine. Human review is required above the quarantine threshold."
detection:
  instrument: "embedding-scorer"
  method: "Embedding distance over the session trajectory, with a per-task-type baseline"
  slmDifficulty: "hard"
  rationale: "Not a classification problem. It is a continuous distance score over a trajectory, needing a baseline per task type rather than a labelled example per instance. A model can name the drift once flagged, but the flag itself comes from the scorer."
  inGate1: false
  dependsOn:
    - "Full tool-call sequence per session"
    - "Declared task objective at session start"
evidence:
  - "Expected-behaviour baseline and abnormal-behaviour criteria (AGSC SAF-01)"
  - "Alert records against defined thresholds (ADG MC-8)"
anchors:
  -
    framework: "agsc"
    id: "SAF-01"
    label: "Autonomous System Oversight"
    weight: "primary"
    rationale: "The control exists to catch an agent operating outside its expected behaviour without anyone watching."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "ALN-01"
    label: "Autonomy Boundary Control"
    weight: "supporting"
    rationale: "Drift is the boundary being approached from the inside rather than breached from the outside."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Drift is named in this control’s scope alongside abuse and configuration drift."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-2"
    label: "Risk Classification"
    weight: "supporting"
    rationale: "The autonomy tier a detection downgrades is the tier this control assigns."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM03"
    label: "Excessive Agency"
    weight: "primary"
    rationale: "Excessive autonomy is one of the three named root causes, and drift is how it manifests over a long session."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM07"
    label: "Misinformation"
    weight: "supporting"
    rationale: "Incorrect state inference in workflows: the agent believes a condition was met when it was not."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI01"
    label: "Agent Goal Hijack"
    weight: "primary"
    rationale: "Adversarially induced drift is precisely goal hijack."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI10"
    label: "Rogue Agents"
    weight: "supporting"
    rationale: "Sustained off-task operation with reported success matches the rogue-agent failure mode."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0014"
    label: "Command and Control"
    weight: "primary"
    rationale: "Sustained adversarial control of an agent’s objective is a C2 relationship."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0051"
    label: "LLM Prompt Injection"
    weight: "supporting"
    rationale: "The delivery mechanism for adversarially induced drift."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "—"
    label: "Emergent drift"
    weight: "primary"
    verification: "gap"
    rationale: "No published ATLAS technique models drift that emerges without an adversary. The AGSC and ADG controls carry this case on their own."
regulatory:
  - "EU AI Act Art. 14, 15"
  - "NIST AI RMF MANAGE 4.1"
  - "ISO/IEC 42001 A.6.2, A.9"
