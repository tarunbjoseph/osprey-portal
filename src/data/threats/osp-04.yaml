code: "OSP-04"
name: "Tool-Chain Exploitation"
order: 4
scope: "core"
behaviour: "Individually legitimate tools are chained into a harmful outcome. Each call passes its own permission check, but the sequence does something no single call would be allowed to do — reading a secret with one tool and transmitting it with another."
signals:
  - "Tool-call sequences absent from the learned baseline"
  - "Read-then-transmit patterns across different tools"
  - "Unusual argument values passed between calls"
  - "Call depth or recursion above baseline"
  - "A tool output becoming the next call’s argument with no validation step between"
severity: "high"
harmClasses:
  - "technical"
action:
  peak: "quarantine"
  summary: "Quarantine the session and pause the pipeline through the Harness policy gate."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Required before the session resumes. The chain has to be read by a person, because what makes it malicious is the combination rather than any one call."
detection:
  instrument: "sequence-model"
  method: "Sequence model over the call trajectory, with rule coverage of known-bad shapes first"
  slmDifficulty: "hard"
  rationale: "The malicious unit is the sequence, not any single call. Needs the full trajectory as input and a baseline of normal sequences. Expect rule coverage of known-bad patterns first and model coverage later."
  inGate1: false
  dependsOn:
    - "Full tool-call sequence per session"
    - "Argument capture per call"
evidence:
  - "Autonomy-boundary enforcement records: which chains were permitted, which were stopped (AGSC ALN-01)"
  - "Per-tool invocation policy evidence (ADG MC-7)"
anchors:
  -
    framework: "agsc"
    id: "ALN-01"
    label: "Autonomy Boundary Control"
    weight: "primary"
    rationale: "The boundary is defined over the action space, which is what a chain traverses."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SEC-01"
    label: "Multi-Agent Coordination Security"
    weight: "supporting"
    rationale: "Chains that cross agents inherit this control too."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-7"
    label: "Tool and MCP Register"
    weight: "primary"
    rationale: "Per-invocation policy evaluation is the control that a chain defeats one call at a time."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "supporting"
    rationale: "Unsafe actions in production are named in scope."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM03"
    label: "Excessive Agency"
    weight: "primary"
    rationale: "Excessive functionality and excessive permissions are two of the three named root causes."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI02"
    label: "Tool Misuse & Exploitation"
    weight: "primary"
    rationale: "The direct agentic counterpart, including the \"lethal trifecta\" conditions."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0053"
    label: "AI Agent Tool Invocation"
    weight: "primary"
    rationale: "Invocation of agent tools toward an adversary objective."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0005"
    label: "Execution"
    weight: "supporting"
    rationale: "A successful chain drives the agent to run adversary-chosen operations."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 14, 15"
  - "NIST AI RMF MANAGE 4.1"
  - "ISO/IEC 42001 A.9"
