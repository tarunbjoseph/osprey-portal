code: "OSP-05"
name: "Privilege & Identity Abuse"
order: 5
scope: "core"
behaviour: "The agent acts with credentials or scopes broader than its task needs, or borrows a human’s identity to perform something that human never approved. Includes long-lived tokens used well beyond their intended session."
signals:
  - "Calls to tools outside the agent’s declared scope"
  - "Use of long-lived or shared tokens"
  - "Credential-read events"
  - "Role or scope escalation partway through a call chain"
  - "One service account serving several agent identities"
severity: "critical"
harmClasses:
  - "technical"
action:
  peak: "quarantine"
  summary: "Block and quarantine immediately. A deterministic check against the declared scope, not a model decision."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Always, with no exceptions. This is the control that proves every agent action traces back to a human authority, so an automated dismissal would defeat its purpose."
detection:
  instrument: "deterministic"
  method: "Lookup against the agent identity register and declared scope"
  rationale: "Should never be a model decision. Comparing a call against a declared scope is a lookup. Routing it through a classifier would add false negatives to something that can be exact."
  inGate1: false
  dependsOn:
    - "Machine-readable declared scope per agent"
    - "Agent identity register"
evidence:
  - "Agent identity register and least-privilege authorization decisions (AGSC SEC-02)"
  - "Inventory entries with named owner (ADG MC-1)"
anchors:
  -
    framework: "agsc"
    id: "SEC-02"
    label: "Agent Identity & Least-Privilege Authorization"
    weight: "primary"
    rationale: "This label is the runtime enforcement of that control."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-1"
    label: "AI System Inventory"
    weight: "primary"
    rationale: "The register checked against is the artifact this control requires."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-3"
    label: "Separation of Duties"
    weight: "supporting"
    rationale: "An agent authorising its own privileged action collapses the separation."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-7"
    label: "Tool and MCP Register"
    weight: "supporting"
    rationale: "Scope is expressed per tool in the register."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM03"
    label: "Excessive Agency"
    weight: "primary"
    rationale: "Excessive permissions — the tool connects with an identity holding more rights than the task needs."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI03"
    label: "Identity & Privilege Abuse"
    weight: "primary"
    rationale: "The direct agentic counterpart."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0055"
    label: "Unsecured Credentials"
    weight: "primary"
    rationale: "Credentials reachable by the agent that should not be."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0012"
    label: "Privilege Escalation"
    weight: "supporting"
    rationale: "An agent on a trusted backend acting under elevated credentials."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0013"
    label: "Credential Access"
    weight: "supporting"
    rationale: "Credential-read events are the enabling step."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 15"
  - "NIST AI RMF MANAGE 2.x"
  - "ISO/IEC 42001 A.9 (with ISO/IEC 27001)"
