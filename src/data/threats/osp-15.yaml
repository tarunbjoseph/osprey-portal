code: "OSP-15"
name: "Hidden Context & Instruction Exposure"
order: 15
scope: "secondary"
addedIn: "v1.0"
behaviour: "The agent’s own control layer leaks. System prompt, tool schemas, policy logic, trust boundaries or workflow criteria are extracted, inferred or reconstructed, handing an attacker the map they need to attack everything else."
signals:
  - "Outputs quoting or paraphrasing system-prompt text"
  - "Tool or function schemas appearing in responses"
  - "Probing sequences that enumerate capabilities"
  - "Responses describing internal policy thresholds"
  - "Repeated near-miss requests whose phrasing shifts after each refusal"
severity: "medium"
severityNote: "High where hidden context holds credentials or where the application relies on its secrecy to gate authorization."
harmClasses:
  - "technical"
harmNote: "An enabler rather than an endpoint: the damage is what it makes possible next."
action:
  peak: "block"
  summary: "Block the disclosing output and log. Treat a detection as a trigger to re-check whether anything security-relevant is sitting in the context at all."
  tier: "HOTL"
  humanReview: "conditional"
  reviewNote: "No human needed for the block. A governance review is triggered if the exposed context turns out to gate an authorization decision."
detection:
  instrument: "hybrid"
  method: "Similarity check against known hidden context, SLM classifier for paraphrase and inference"
  slmDifficulty: "easy-medium"
  rationale: "Verbatim leakage is a similarity comparison against a string the platform already holds — cheap and exact. The model earns its place on paraphrase and inference. Synthetic data is easy to generate, which makes this the second most likely label to reach its accuracy target."
  inGate1: true
  dependsOn:
    - "Access to the assembled system context for comparison"
evidence:
  - "Context-boundary decisions and blocked-disclosure records (AGSC SEC-07)"
  - "Context policy review evidence (ADG MC-6)"
anchors:
  -
    framework: "agsc"
    id: "SEC-07"
    label: "Memory & Context Lifecycle Security"
    weight: "primary"
    rationale: "Hidden context is context, and its boundary is this control’s concern."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SEC-03"
    label: "Prompt Injection & Adversarial Input Defense"
    weight: "supporting"
    rationale: "Extraction attempts arrive through the same ingestion points as injection."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SAF-05"
    label: "AI Output Monitoring & Safeguards"
    weight: "supporting"
    rationale: "Blocking the disclosing output."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-6"
    label: "Context Policy"
    weight: "primary"
    rationale: "What may sit in hidden context, and what may never, is a context-policy decision."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Data leakage in production is named in scope."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM08"
    label: "Hidden Context Exposure"
    weight: "primary"
    rationale: "The 2026 re-scoping of System Prompt Leakage into a broader failure to keep control context out of reach."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI06"
    label: "Memory & Context Poisoning"
    weight: "supporting"
    rationale: "Named by LLM08 as the pointer for persistent-memory amplification of this risk."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI07"
    label: "Insecure Inter-Agent Communication"
    weight: "supporting"
    rationale: "Named by LLM08 as the pointer for hidden context propagating across agent channels."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0008"
    label: "Discovery"
    weight: "primary"
    rationale: "Enumerating capabilities and policy logic."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0010"
    label: "Exfiltration"
    weight: "supporting"
    rationale: "Moving that control context out of the system."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 15"
  - "NIST AI RMF MEASURE 2.7"
  - "ISO/IEC 42001 A.6.2"
