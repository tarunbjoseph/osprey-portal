code: "OSP-12"
name: "Supply Chain & Tool Integrity"
order: 14
scope: "secondary"
behaviour: "A tool, MCP server, model or schema the agent depends on is swapped, poisoned, or silently changed. The agent behaves correctly against a component that is no longer trustworthy."
signals:
  - "Tool schema or endpoint changes between sessions"
  - "Unsigned or newly published tool versions"
  - "A tool’s described behaviour diverging from its observed behaviour"
  - "Registry reputation shifts"
  - "An unexpected model or adapter version at inference time"
severity: "high"
harmClasses:
  - "technical"
  - "systemic"
harmNote: "Systemic because every agent depending on the component inherits the compromise at once."
action:
  peak: "block"
  summary: "Block and alert. Handled primarily at the Harness deployment gate rather than at runtime."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Required to approve any changed component before it re-enters the pipeline."
detection:
  instrument: "deterministic"
  method: "Registry diff and signature check between runs"
  rationale: "Deployment-gate territory. Comparing tool schemas, versions and signatures between runs is deterministic, and belongs in the CI/CD gate rather than in the runtime classifier."
  inGate1: false
  dependsOn:
    - "Component registry with signatures"
    - "Per-run component manifest"
evidence:
  - "Third-party component register and change approvals (AGSC GOV-03, GOV-07)"
  - "Tool and MCP register with approval status (ADG MC-7)"
anchors:
  -
    framework: "agsc"
    id: "GOV-03"
    label: "Third-Party & Supply-Chain Oversight"
    weight: "primary"
    rationale: "External components changing without assessment is the failure this control prevents."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "GOV-01"
    label: "Data Provenance & Input Integrity"
    weight: "supporting"
    rationale: "A poisoned tool is a compromised input source."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "GOV-07"
    label: "AI Lifecycle & Registry Management"
    weight: "supporting"
    rationale: "The registry is what an observed component is compared against."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-7"
    label: "Tool and MCP Register"
    weight: "primary"
    rationale: "Trust tiering and third-party assurance status map one-to-one onto this label."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-5"
    label: "Change Control"
    weight: "primary"
    rationale: "An unapproved component change is a change-control failure seen at runtime."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-12"
    label: "Shared Responsibility Documentation"
    weight: "supporting"
    rationale: "A vendor component changing triggers a responsibility-matrix review."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM04"
    label: "Supply Chain"
    weight: "primary"
    rationale: "Model artifacts, provenance and conversion workflows as first-class attack surfaces."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM05"
    label: "Data and Model Poisoning"
    weight: "supporting"
    rationale: "Malicious models distributed through public repositories."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI04"
    label: "Agentic Supply Chain Vulnerabilities"
    weight: "primary"
    rationale: "The entry OWASP LLM04 explicitly defers agentic supply-chain risk to, covering MCP servers and tool registries."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0010"
    label: "AI Supply Chain Compromise"
    weight: "primary"
    rationale: "Cited by OWASP LLM04:2026 as the corresponding adversary technique."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0110"
    label: "AI Agent Tool Poisoning"
    weight: "primary"
    rationale: "A tool the agent trusts turned against it."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0018"
    label: "Manipulate AI Model"
    weight: "supporting"
    rationale: "Backdoored or tampered model artifacts."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 25"
  - "NIST AI RMF GOVERN 6.1"
  - "ISO/IEC 42001 A.10"
