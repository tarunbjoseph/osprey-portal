code: "OSP-08"
name: "Sensitive Data Exposure"
order: 10
scope: "secondary"
behaviour: "The agent surfaces or transmits data the requester is not entitled to — PII, secrets, or cross-tenant content — through its output, its memory, its tool-call arguments, or its reasoning trace."
signals:
  - "PII or secret patterns in agent output or tool-call arguments"
  - "Cross-tenant identifiers appearing in a single session"
  - "Memory reads returning content from another user’s context"
  - "Outbound calls carrying regulated fields"
  - "Embeddings or vector-store backups leaving the trust boundary"
severity: "high"
harmClasses:
  - "technical"
  - "societal"
harmNote: "Societal because the harm lands on data subjects who were never party to the session."
action:
  peak: "quarantine"
  summary: "Quarantine the output, redact, and log as a potentially reportable event."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Required. The incident record has to be complete enough to support a reporting decision under whichever regime applies."
detection:
  instrument: "hybrid"
  method: "Pattern matching and entity detection, with a model for unstructured disclosure"
  slmDifficulty: "medium"
  rationale: "Regex and entity detection handle structured secrets well. The residual model problem is unstructured disclosure and cross-tenant leakage in paraphrase, which is where labels are hardest to source."
  inGate1: true
  dependsOn:
    - "Output and tool-argument capture"
    - "Tenant attribution per session"
evidence:
  - "Memory and context lifecycle records; redaction decisions (AGSC SEC-07)"
  - "Incident evidence pack (ADG MC-9)"
anchors:
  -
    framework: "agsc"
    id: "SEC-07"
    label: "Memory & Context Lifecycle Security"
    weight: "primary"
    rationale: "Cross-user and cross-session leakage is the failure this control prevents."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SAF-05"
    label: "AI Output Monitoring & Safeguards"
    weight: "supporting"
    rationale: "Blocking a disclosing output before it lands."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-6"
    label: "Context Policy"
    weight: "primary"
    rationale: "Redaction rules and data-class handling."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-9"
    label: "AI Incident Response"
    weight: "primary"
    rationale: "Reportable events need replayable evidence."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM02"
    label: "Sensitive Information Disclosure"
    weight: "primary"
    rationale: "The 2026 entry explicitly widens the disclosure surface to tool-call arguments, reasoning traces and telemetry."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM09"
    label: "Vector and Embedding Weaknesses"
    weight: "supporting"
    rationale: "Cross-tenant retrieval and embedding inversion are recognised leak paths."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI06"
    label: "Memory & Context Poisoning"
    weight: "primary"
    rationale: "Persistent agent memory leading to cross-session data leakage."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0057"
    label: "LLM Data Leakage"
    weight: "primary"
    rationale: "Data leaving the system through the model."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0010"
    label: "Exfiltration"
    weight: "supporting"
    rationale: "The tactic the leak serves."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 10, 12, 15"
  - "NIST AI RMF MANAGE 2.x"
  - "ISO/IEC 42001 A.7"
