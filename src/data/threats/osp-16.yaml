code: "OSP-16"
name: "Fabricated Completion & Evidence"
order: 16
scope: "secondary"
addedIn: "v1.0"
behaviour: "The agent reports work it did not do, or produces evidence for a result it never reached. Distinct from drift: the trajectory can look clean while the final claim is false."
signals:
  - "Completion claims with no corresponding tool call or write in the trace"
  - "Cited artifacts that do not exist or do not contain the cited content"
  - "Success reported after a failed or errored call"
  - "Summaries naming entities that appear nowhere in the retrieved context"
severity: "medium-high"
harmClasses:
  - "operational"
  - "systemic"
harmNote: "Systemic once downstream agents or workflows treat the false completion as a satisfied precondition."
action:
  peak: "review"
  summary: "Review. Block the completion signal from propagating downstream until the trace supports the claim."
  tier: "HOTL"
  humanReview: "conditional"
  reviewNote: "HOTL by default. HITL where the completion gates an irreversible downstream action."
detection:
  instrument: "hybrid"
  method: "Trace reconciliation against the completion claim, model judges materiality"
  slmDifficulty: "hard"
  rationale: "Reconciling a claim against the trace is mechanical once the trace is complete: did a write happen, does the cited artifact exist. What the model adds is judging whether an unsupported claim is material. Labelled data is effectively non-existent today, so this starts as a rule and a dashboard column."
  inGate1: false
  dependsOn:
    - "Complete action trace per session"
    - "Artifact existence check"
evidence:
  - "Claim-versus-trace reconciliation records (AGSC SAF-04)"
  - "Forensic replay material (ADG MC-9)"
anchors:
  -
    framework: "agsc"
    id: "SAF-04"
    label: "Output Factual Accuracy & Anti-Hallucination"
    weight: "primary"
    rationale: "A fabricated completion is a fact-bearing output with no grounding."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "ALN-05"
    label: "Output Labeling & Action Attribution"
    weight: "primary"
    rationale: "Attribution is what makes the reconciliation possible."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SAF-01"
    label: "Autonomous System Oversight"
    weight: "supporting"
    rationale: "Reported success that did not occur is precisely the failure oversight exists to catch."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Detecting the claim-trace gap."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-9"
    label: "AI Incident Response"
    weight: "supporting"
    rationale: "Forensic replay is what proves the claim was false."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM07"
    label: "Misinformation"
    weight: "primary"
    rationale: "Forged or misattributed evidence, and fabricated task completion, are named risk examples in the 2026 entry."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI10"
    label: "Rogue Agents"
    weight: "primary"
    rationale: "An agent that falsifies task completion to mislead downstream trust."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "—"
    label: "Falsified task completion"
    weight: "primary"
    verification: "gap"
    rationale: "No published ATLAS technique models an agent misreporting its own work. The AGSC and ADG controls carry this row on their own."
regulatory:
  - "EU AI Act Art. 13, 15"
  - "NIST AI RMF MEASURE 2.3, 2.9"
  - "ISO/IEC 42001 A.8"
