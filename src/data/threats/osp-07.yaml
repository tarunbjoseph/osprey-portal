code: "OSP-07"
name: "Unsafe Output & Code Execution"
order: 7
scope: "core"
behaviour: "The agent generates output that is executed or acted on downstream without validation, turning generated text into running code, a live query, or a rendered document."
signals:
  - "Code blocks routed directly to execution tools"
  - "Shell, SQL or template-injection patterns in outputs"
  - "Execution calls not preceded by a validation step"
  - "ANSI or control characters written to terminal, log or IDE sinks"
  - "Auto-fetched external resources such as markdown image URLs in rendered output"
severity: "high"
harmClasses:
  - "technical"
action:
  peak: "block"
  summary: "Block execution pending validation. Quarantine when the pattern matches a known exploit shape."
  tier: "HITL"
  humanReview: "conditional"
  reviewNote: "The block itself is automatic and needs no human. Releasing a blocked execution requires HITL approval."
detection:
  instrument: "hybrid"
  method: "Static pattern check for known shapes, SLM classifier for obfuscated or novel payloads"
  slmDifficulty: "medium"
  rationale: "Pattern matching catches the obvious cases cheaply. The model is needed for obfuscated or novel payloads — exactly where labelled data will be thinnest."
  inGate1: true
  dependsOn:
    - "Output capture before the downstream sink"
    - "Sink type attribution (shell / SQL / renderer)"
evidence:
  - "Output-safeguard decisions and blocked-execution records (AGSC SAF-05)"
  - "Release-gate verification (ADG MC-4)"
anchors:
  -
    framework: "agsc"
    id: "SAF-05"
    label: "AI Output Monitoring & Safeguards"
    weight: "primary"
    rationale: "Safeguards that block risky outputs before they create harm."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SEC-03"
    label: "Prompt Injection & Adversarial Input Defense"
    weight: "supporting"
    rationale: "Injection is the usual upstream cause of a weaponised output."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Unsafe actions in production."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-4"
    label: "Pre-Production Evaluation"
    weight: "supporting"
    rationale: "Failure-mode testing before go-live."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM10"
    label: "Improper Output Handling"
    weight: "primary"
    rationale: "The entry that owns insufficient validation of model output before it reaches a downstream component."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM01"
    label: "Prompt Injection"
    weight: "supporting"
    rationale: "Injection is what makes the output attacker-controlled in the first place."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI05"
    label: "Unexpected Code Execution (RCE)"
    weight: "primary"
    rationale: "The direct agentic counterpart."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0005"
    label: "Execution"
    weight: "primary"
    rationale: "Generated content becoming a running command."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 15"
  - "NIST AI RMF MEASURE 2.x; MANAGE 4.1"
  - "ISO/IEC 42001 A.6.2"
