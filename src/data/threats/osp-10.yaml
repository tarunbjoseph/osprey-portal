code: "OSP-10"
name: "Cascading Failure"
order: 12
scope: "secondary"
behaviour: "One agent’s bad output becomes another agent’s trusted input, and a single fault or compromise propagates across the pipeline faster than a human can intervene."
signals:
  - "Correlated anomaly scores across linked sessions"
  - "The same malformed artifact appearing in successive stages"
  - "Retry storms across a workflow"
  - "A spike in downstream failures within one workflow"
severity: "medium-high"
harmClasses:
  - "systemic"
action:
  peak: "quarantine"
  summary: "Quarantine the whole workflow, not just the failing agent."
  tier: "HITL"
  humanReview: "always"
  reviewNote: "Required before any stage of the workflow restarts, because restarting the failing agent alone re-feeds the same bad artifact downstream."
detection:
  instrument: "derived"
  method: "Correlation over per-agent anomaly scores across a workflow"
  rationale: "Computed from other detectors rather than observed directly. It is a correlation over per-agent anomaly scores across a workflow, so it cannot be a classifier label — there is no single input to classify."
  inGate1: false
  dependsOn:
    - "Workflow correlation id across sessions"
    - "Per-agent anomaly scores"
evidence:
  - "Workflow-level containment records (AGSC SAF-02)"
  - "Incident evidence pack and governance review inputs (ADG MC-9, MC-10)"
anchors:
  -
    framework: "agsc"
    id: "SEC-01"
    label: "Multi-Agent Coordination Security"
    weight: "primary"
    rationale: "Safeguards for loops, deadlocks and cascading actions are named in the control."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SAF-01"
    label: "Autonomous System Oversight"
    weight: "supporting"
    rationale: "The workflow as a whole is the autonomous system under oversight."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "SAF-02"
    label: "Emergency Stop & Containment (Kill Switch)"
    weight: "primary"
    rationale: "Containment has to reach the workflow, not just the agent."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Cross-surface anomaly correlation."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-9"
    label: "AI Incident Response"
    weight: "supporting"
    rationale: "A cascade is a multi-system incident."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM07"
    label: "Misinformation"
    weight: "primary"
    rationale: "Cross-agent misinformation propagation: incorrect state produced by one agent and trusted by another."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM06"
    label: "Unbounded Consumption"
    weight: "supporting"
    rationale: "Retry storms and fan-out amplify the cascade."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI08"
    label: "Cascading Failures"
    weight: "primary"
    rationale: "The direct agentic counterpart."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "—"
    label: "Cross-agent fault propagation"
    weight: "primary"
    verification: "gap"
    rationale: "No published ATLAS technique models a fault propagating across agents. The AGSC and ADG controls carry this row on their own."
regulatory:
  - "EU AI Act Art. 14, 15"
  - "NIST AI RMF MANAGE 4.1"
  - "ISO/IEC 42001 A.6.2"
