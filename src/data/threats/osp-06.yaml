code: "OSP-06"
name: "Anomalous Tool Misuse"
order: 6
scope: "core"
behaviour: "One tool used in a way that is technically permitted but statistically abnormal for this agent and task: a bulk delete, an oversized export, a destructive call outside a change window."
signals:
  - "Argument-value outliers against the learned baseline"
  - "Call volume or rate spikes"
  - "Destructive verbs — delete, drop, revoke, purge — outside approved windows"
  - "Result-set sizes far above the task envelope"
severity: "medium-high"
harmClasses:
  - "operational"
  - "technical"
harmNote: "Operational for most outliers; technical once the call is destructive or exfiltrating."
action:
  peak: "review"
  summary: "Review. Hold destructive actions for explicit confirmation before execution."
  tier: "HOTL"
  humanReview: "conditional"
  reviewNote: "HOTL by default. Any destructive verb escalates to HITL and waits for confirmation rather than executing and alerting afterwards."
detection:
  instrument: "statistical"
  method: "Argument and rate outlier detection against a per-agent, per-task baseline"
  slmDifficulty: "medium"
  rationale: "Argument-value and rate outliers are a statistics problem. A model adds value only in judging whether an outlier is contextually justified — an escalation-layer question, not first-pass classification."
  inGate1: false
  dependsOn:
    - "Argument capture per call"
    - "Per-agent call-rate baseline"
evidence:
  - "Anomaly detection logs and alert records (AGSC SEC-04)"
  - "Defined alert thresholds and response SLAs (ADG MC-8)"
anchors:
  -
    framework: "agsc"
    id: "SEC-04"
    label: "Observability, Anomaly Detection & Incident Response"
    weight: "primary"
    rationale: "The control that names abnormal behaviour and unexpected agent activity as its detection target."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "agsc"
    id: "ALN-01"
    label: "Autonomy Boundary Control"
    weight: "supporting"
    rationale: "A permitted-but-abnormal call sits just inside the boundary."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-7"
    label: "Tool and MCP Register"
    weight: "primary"
    rationale: "Trust tiering per tool is what makes \"abnormal for this tool\" meaningful."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "adg"
    id: "MC-8"
    label: "Runtime Monitoring"
    weight: "primary"
    rationale: "Abuse detection in production."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-llm"
    id: "LLM03"
    label: "Excessive Agency"
    weight: "primary"
    rationale: "Impacts span confidentiality, integrity and availability depending on what the tool reaches."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "owasp-asi"
    id: "ASI02"
    label: "Tool Misuse & Exploitation"
    weight: "primary"
    rationale: "The direct agentic counterpart."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.T0053"
    label: "AI Agent Tool Invocation"
    weight: "primary"
    rationale: "Invocation is the observable event; abnormality is the judgement layered on it."
    verification: "verified"
    checked: "2026-09-03"
  -
    framework: "mitre-atlas"
    id: "AML.TA0011"
    label: "Impact"
    weight: "supporting"
    rationale: "Destructive calls land here."
    verification: "verified"
    checked: "2026-09-03"
regulatory:
  - "EU AI Act Art. 12, 15"
  - "NIST AI RMF MEASURE 2.x"
  - "ISO/IEC 42001 A.9"
